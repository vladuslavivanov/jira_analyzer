[project]
name = "jira-analyzer"
version = "0.1.0"
description = "Tool for automatic data collection and analysis of Jira task tracker with AI-driven quality estimation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "importlib-resources>=7.1.0",
    "jira>=3.10.0",
    "openai>=2.31.0",
    "python-dotenv>=1.2.2",
    "pandas>=2.2.0",
    "streamlit>=1.57.0",
]

[project.scripts]
jira-analyzer = "jira_analyzer.cli:main"
mock-jira = "jira_analyzer.mock_jira.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_analyzer"]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"}
]
check = [
    {include-group = "test"},
    {include-group = "lint"}
]
lint = [
    "ruff>=0.15.10",
]
test = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
